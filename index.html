<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0277BD" />
  <title>记账本</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 首页 -->
    <section id="page-home" class="page active">
      <header class="topbar">
        <h1>记账本</h1>
        <button type="button" class="icon-btn" id="btn-search" title="搜索">🔍</button>
      </header>
      <div class="content">
        <div class="card gradient">
          <div class="muted">总资产</div>
          <div class="big" id="home-assets">¥0.00</div>
          <div class="row3">
            <div><div class="muted">本月收入</div><div id="home-income" class="green">¥0</div></div>
            <div><div class="muted">本月支出</div><div id="home-expense" class="indigo">¥0</div></div>
            <div><div class="muted">结余</div><div id="home-balance">¥0</div></div>
          </div>
        </div>
        <div class="card" id="salary-card">
          <div class="row-between">
            <strong>自上次发薪以来</strong>
            <span class="tag" id="salary-days">—</span>
          </div>
          <div class="muted small" id="salary-range">录入分类为「工资」的收入后自动统计</div>
          <div class="row3 mt8">
            <div><div class="muted">累计支出</div><div id="salary-expense" class="indigo">¥0</div></div>
            <div><div class="muted">周期收入</div><div id="salary-income" class="green">¥0</div></div>
            <div><div class="muted">结余</div><div id="salary-balance">¥0</div></div>
          </div>
        </div>
        <div class="quick-row">
          <button type="button" class="outline" id="btn-transfer">转账</button>
          <button type="button" class="outline" id="btn-export">导出备份</button>
          <button type="button" class="outline" id="btn-import">导入备份</button>
        </div>
        <h2 class="section-title">最近账单</h2>
        <div id="home-list"></div>
      </div>
      <button type="button" class="fab" id="btn-add">＋</button>
    </section>

    <!-- 统计 -->
    <section id="page-stats" class="page">
      <header class="topbar"><h1>统计分析</h1></header>
      <div class="content">
        <div class="seg">
          <button type="button" class="seg-btn active" data-mode="month">自然月</button>
          <button type="button" class="seg-btn" data-mode="salary">发薪周期</button>
        </div>
        <div class="card nav-card">
          <button type="button" id="stats-prev">‹</button>
          <div class="center">
            <div id="stats-title">—</div>
            <div class="muted small" id="stats-sub"></div>
          </div>
          <button type="button" id="stats-next">›</button>
        </div>
        <div class="card">
          <div class="row3">
            <div><div class="muted">收入</div><div id="stats-income" class="green">¥0</div></div>
            <div><div class="muted">支出</div><div id="stats-expense" class="indigo">¥0</div></div>
            <div><div class="muted">结余</div><div id="stats-balance">¥0</div></div>
          </div>
        </div>
        <h2 class="section-title">支出分类</h2>
        <div id="stats-cats"></div>
      </div>
    </section>

    <!-- 预算 -->
    <section id="page-budget" class="page">
      <header class="topbar">
        <h1>预算</h1>
        <button type="button" class="text-btn" id="btn-add-budget">添加</button>
      </header>
      <div class="content">
        <div class="seg">
          <button type="button" class="seg-btn active" data-budget-mode="month">自然月</button>
          <button type="button" class="seg-btn" data-budget-mode="salary">发薪周期</button>
        </div>
        <p class="hint" id="budget-hint"></p>
        <div class="card">
          <div class="muted" id="budget-label">本月总预算</div>
          <div class="big" id="budget-total">未设置</div>
          <div class="bar"><div class="bar-fill" id="budget-bar"></div></div>
          <div class="muted small" id="budget-used"></div>
        </div>
        <div id="budget-list"></div>
      </div>
    </section>

    <!-- 我的 -->
    <section id="page-mine" class="page">
      <header class="topbar"><h1>我的</h1></header>
      <div class="content">
        <div class="card center-card">
          <div class="avatar">记</div>
          <div>网页版记账本</div>
          <div class="muted small">数据保存在本机浏览器中</div>
        </div>
        <div class="menu">
          <button type="button" id="menu-accounts">账户管理</button>
          <button type="button" id="menu-categories">分类管理</button>
          <button type="button" id="menu-export">导出备份</button>
          <button type="button" id="menu-import">导入备份</button>
          <button type="button" id="menu-clear" class="danger">清空全部数据</button>
        </div>
        <p class="hint">iPhone：Safari 打开后可点分享 →「添加到主屏幕」，像 App 一样使用。</p>
      </div>
    </section>

    <nav class="tabbar">
      <button type="button" class="tab active" data-page="home"><span>🏠</span>首页</button>
      <button type="button" class="tab" data-page="stats"><span>📊</span>统计</button>
      <button type="button" class="tab" data-page="budget"><span>💰</span>预算</button>
      <button type="button" class="tab" data-page="mine"><span>👤</span>我的</button>
    </nav>
  </div>

  <!-- 弹层：记账 -->
  <div class="modal" id="modal-tx" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <button type="button" class="text-btn" data-close>取消</button>
        <strong id="tx-modal-title">记一笔</strong>
        <button type="button" class="text-btn primary" id="tx-save">保存</button>
      </div>
      <div class="seg">
        <button type="button" class="seg-btn active" data-tx-type="expense">支出</button>
        <button type="button" class="seg-btn" data-tx-type="income">收入</button>
      </div>
      <label>金额<input type="number" id="tx-amount" inputmode="decimal" placeholder="0.00" step="0.01" /></label>
      <label>分类<select id="tx-category"></select></label>
      <label>账户<select id="tx-account"></select></label>
      <label>日期时间<input type="datetime-local" id="tx-date" /></label>
      <label>备注<input type="text" id="tx-note" placeholder="可选" /></label>
    </div>
  </div>

  <!-- 弹层：转账 -->
  <div class="modal" id="modal-transfer" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <button type="button" class="text-btn" data-close>取消</button>
        <strong>转账</strong>
        <button type="button" class="text-btn primary" id="tf-save">确认</button>
      </div>
      <label>金额<input type="number" id="tf-amount" inputmode="decimal" step="0.01" /></label>
      <label>转出账户<select id="tf-from"></select></label>
      <label>转入账户<select id="tf-to"></select></label>
      <label>日期时间<input type="datetime-local" id="tf-date" /></label>
      <label>备注<input type="text" id="tf-note" placeholder="可选" /></label>
    </div>
  </div>

  <!-- 弹层：通用列表/表单 -->
  <div class="modal" id="modal-generic" hidden>
    <div class="sheet tall">
      <div class="sheet-head">
        <button type="button" class="text-btn" data-close>关闭</button>
        <strong id="generic-title">—</strong>
        <button type="button" class="text-btn primary" id="generic-action" hidden>添加</button>
      </div>
      <div id="generic-body"></div>
    </div>
  </div>

  <input type="file" id="file-import" accept="application/json,.json" hidden />
  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
